<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subject Archives</title>
  <style>
    :root { --bg-theme: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=80'); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, serif; background-image: var(--bg-theme); background-size: cover; background-position: center; display: flex; justify-content: center; align-items: center; height: 100vh; }
    
    .workspace { width: 90vw; max-width: 900px; height: 75vh; display: flex; flex-direction: column; }
    .tabs { display: flex; gap: 5px; margin-left: 20px; }
    .tab { padding: 12px 20px; background: rgba(231, 224, 213, 0.85); border-radius: 12px 12px 0 0; cursor: pointer; font-weight: bold; color: #777; transition: 0.2s; backdrop-filter: blur(5px); }
    .tab.active { background: #fbf9f5; color: #2b1f18; border-top: 3px solid #6e7a5b; }
    
    .board { flex: 1; background: #fbf9f5; border-radius: 18px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); overflow-y: auto; }
    
    .matrix-grid { display: grid; grid-template-rows: repeat(7, 15px); grid-auto-flow: column; grid-auto-columns: 15px; gap: 4px; margin: 20px 0; overflow-x: auto; padding-bottom: 10px; }
    .cube { width: 15px; height: 15px; border-radius: 3px; background: #ece8e1; }
    .cube.lvl-1 { background: #d2dbbe; } .cube.lvl-2 { background: #a7ad8a; } .cube.lvl-3 { background: #6e7a5b; } .cube.lvl-4 { background: #4a523a; }
    
    .input-bar { display: flex; gap: 10px; margin-bottom: 20px; }
    .input-bar input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; font-family: -apple-system, sans-serif; }
    .input-bar button { padding: 12px 20px; background: #4a523a; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    
    .log-tray { font-size: 14px; color: #555; display: flex; flex-direction: column; gap: 8px; font-family: -apple-system, sans-serif; }
    .log-item { display: flex; justify-content: space-between; border-bottom: 1px dashed #ddd; padding-bottom: 8px; }

    /* 완벽 연결 하단 독 */
    .bottom-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(35, 25, 20, 0.85); backdrop-filter: blur(10px); padding: 10px 15px; border-radius: 20px; display: flex; gap: 10px; z-index: 999; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
    .dock-btn { text-decoration: none; color: #aaa; font-family: -apple-system, sans-serif; font-size: 14px; padding: 8px 16px; border-radius: 12px; transition: 0.2s; background: transparent; border: none; cursor: pointer; }
    .dock-btn.active, .dock-btn:hover { background: rgba(255,255,255,0.2); color: white; font-weight: bold; }
  </style>
</head>
<body>
  <div class="workspace">
    <div class="tabs" id="tabs"></div>
    <div class="board">
      <h2 id="subj-title" style="color:#2b1f18; margin-bottom: 5px;">AP Biology</h2>
      <div class="matrix-grid" id="grid"></div>
      
      <div class="input-bar">
        <input type="text" id="log-input" placeholder="Record today's study (e.g. Chapter 3, 15p)">
        <button onclick="addLog()">Log</button>
      </div>
      <div class="log-tray" id="tray"></div>
    </div>
  </div>

  <div class="bottom-dock">
    <a href="index_study.html" class="dock-btn">📌 Board</a>
    <a href="grass.html" class="dock-btn active">🌿 Archives</a>
    <a href="history.html" class="dock-btn">🗓️ Chronicle</a>
    <a href="word_room.html" class="dock-btn">🏛️ Voca Room</a>
  </div>

  <script>
    const subjects = ["AP Biology", "Literature", "Vocabulary", "Math"];
    let currSubj = subjects[0];
    const today = new Date().toISOString().split('T')[0];

    function renderTabs() {
      const t = document.getElementById('tabs'); t.innerHTML = '';
      subjects.forEach(s => {
        const d = document.createElement('div');
        d.className = `tab ${s===currSubj ? 'active' : ''}`;
        d.innerText = s;
        d.onclick = () => { currSubj = s; renderTabs(); renderData(); };
        t.appendChild(d);
      });
      const savedBg = localStorage.getItem('user_bg');
      if(savedBg) document.documentElement.style.setProperty('--bg-theme', `url('${savedBg}')`);
    }

    function addLog() {
      const text = document.getElementById('log-input').value;
      if(!text) return;
      const data = JSON.parse(localStorage.getItem('grass_db') || '{}');
      if(!data[currSubj]) data[currSubj] = {};
      if(!data[currSubj][today]) data[currSubj][today] = { score: 0, list: [] };
      
      data[currSubj][today].score += 5;
      data[currSubj][today].list.push(text);
      localStorage.setItem('grass_db', JSON.stringify(data));
      
      const history = JSON.parse(localStorage.getItem('history_db') || '{}');
      if(!history[today]) history[today] = { score:0, list:[] };
      history[today].score += 5;
      history[today].list.push(`[${currSubj}] ${text}`);
      localStorage.setItem('history_db', JSON.stringify(history));

      document.getElementById('log-input').value = '';
      renderData();
    }

    function renderData() {
      document.getElementById('subj-title').innerText = currSubj;
      const data = JSON.parse(localStorage.getItem('grass_db') || '{}');
      const sData = data[currSubj] || {};
      
      const grid = document.getElementById('grid'); grid.innerHTML = '';
      for(let i=110; i>=0; i--) {
        const d = new Date(); d.setDate(d.getDate() - i);
        const k = d.toISOString().split('T')[0];
        const day = sData[k] || { score: 0 };
        const cube = document.createElement('div');
        cube.className = 'cube';
        if(day.score > 15) cube.classList.add('lvl-4');
        else if(day.score > 10) cube.classList.add('lvl-3');
        else if(day.score > 5) cube.classList.add('lvl-2');
        else if(day.score > 0) cube.classList.add('lvl-1');
        grid.appendChild(cube);
      }

      const tray = document.getElementById('tray'); tray.innerHTML = '';
      const tData = sData[today]?.list || [];
      tData.forEach(l => {
        tray.innerHTML += `<div class="log-item"><span>${l}</span><span style="color:#6e7a5b; font-weight:bold;">+5 pts</span></div>`;
      });
    }

    window.onload = () => { renderTabs(); renderData(); };
  </script>
</body>
</html>
