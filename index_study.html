<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus & Goal Board</title>
  <style>
    :root {
      --bg-theme: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=80');
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw; height: 100vh; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Playfair Display", serif;
      background-image: var(--bg-theme); background-size: cover; background-position: center;
      display: flex; justify-content: center; align-items: center;
    }
    
    /* 핀터레스트 도마 사진과 싱크로율 99%인 리얼 월넛 도마 디자인 */
    .wood-board {
      width: 88vw; max-width: 980px; height: 78vh; max-height: 670px;
      background: linear-gradient(135deg, #5c3217 0%, #7d4621 35%, #4a2610 70%, #633719 100%);
      border-radius: 36px; padding: 35px; position: relative;
      box-shadow: inset 0 0 35px rgba(0,0,0,0.65), 0 30px 60px rgba(0,0,0,0.5);
      border: 4px solid #361b0a;
    }
    /* 도마 특유의 안쪽 홈(Groove Line) 입체 효과 */
    .wood-board::before {
      content: ''; position: absolute; top: 18px; left: 18px; right: 18px; bottom: 18px;
      border: 2px dashed rgba(255,255,255,0.12); border-radius: 24px; pointer-events: none;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
    }

    .board-header { display: flex; justify-content: space-between; align-items: center; z-index: 5; position: relative; }
    .board-title { color: rgba(255, 245, 238, 0.85); font-size: 16px; letter-spacing: 2.5px; font-weight: bold; text-transform: uppercase; }
    
    .header-btns { display: flex; gap: 10px; }
    .btn-action { background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35); color: white; border-radius: 50%; width: 38px; height: 38px; font-size: 18px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
    .btn-action:hover { background: rgba(255,255,255,0.35); transform: scale(1.08); }
    
    .sticky-container { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px; height: 82%; overflow-y: auto; padding-bottom: 50px; z-index: 5; position: relative; }
    .sticky-note { padding: 16px; border-radius: 6px; box-shadow: 0 8px 20px rgba(0,0,0,0.25); display: flex; flex-direction: column; justify-content: space-between; color: #2b1f18; font-family: -apple-system, sans-serif; font-size: 14px; width: 175px; min-height: 150px; transition: 0.2s; }
    .sticky-note:hover { transform: scale(1.05) !important; z-index: 10; box-shadow: 0 12px 30px rgba(0,0,0,0.35); }
    .del-btn { align-self: flex-end; background: none; border: none; color: rgba(0,0,0,0.3); font-size: 16px; cursor: pointer; }
    .del-btn:hover { color: #d32f2f; }

    /* 완벽 연결 하단 독 */
    .bottom-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(35, 25, 20, 0.85); backdrop-filter: blur(10px); padding: 10px 15px; border-radius: 20px; display: flex; gap: 10px; z-index: 999; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
    .dock-btn { text-decoration: none; color: #aaa; font-family: -apple-system, sans-serif; font-size: 14px; padding: 8px 16px; border-radius: 12px; transition: 0.2s; background: transparent; border: none; cursor: pointer; }
    .dock-btn.active, .dock-btn:hover { background: rgba(255,255,255,0.2); color: white; font-weight: bold; }
    
    .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: white; padding: 25px; border-radius: 16px; z-index: 1000; width: 320px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    .modal textarea { width: 100%; height: 80px; margin-bottom: 15px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-family: -apple-system, sans-serif; }
    .modal button { padding: 8px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .submit-btn { background: #5c3a21; color: white; float: right; }
  </style>
</head>
<body>

  <div class="wood-board">
    <div class="board-header">
      <span class="board-title">STUDY BOARD</span>
      <div class="header-btns">
        <button class="btn-action" onclick="document.getElementById('bg-file').click()" title="Change Background">🖼️</button>
        <input type="file" id="bg-file" accept="image/*" style="display:none" onchange="changeBg(event)">
        <button class="btn-action" onclick="openModal()">+</button>
      </div>
    </div>
    <div class="sticky-container" id="container"></div>
  </div>

  <div class="bottom-dock">
    <a href="index_study.html" class="dock-btn active">📌 Board</a>
    <a href="grass.html" class="dock-btn">🌿 Archives</a>
    <a href="history.html" class="dock-btn">🗓️ Chronicle</a>
    <a href="word_room.html" class="dock-btn">🏛️ Voca Room</a>
  </div>

  <div id="modal" class="modal">
    <h3 style="margin-bottom:10px; color: #333;">New Note</h3>
    <textarea id="note-text" placeholder="Record goal or note..."></textarea>
    <button onclick="closeModal()">Cancel</button>
    <button class="submit-btn" onclick="addNote()">Pin to Board</button>
  </div>

  <script>
    const colors = ["#DCCDBA", "#E6D9CB", "#DCE0C5", "#F2E7E3"];
    function loadNotes() {
      const notes = JSON.parse(localStorage.getItem('my_notes') || '[]');
      const container = document.getElementById('container');
      container.innerHTML = '';
      notes.forEach(n => {
        const div = document.createElement('div');
        div.className = 'sticky-note';
        div.style.backgroundColor = n.color;
        div.style.transform = `rotate(${n.rot}deg)`;
        div.innerHTML = `<div>${n.text}</div> <button class="del-btn" onclick="delNote(${n.id})">✖</button>`;
        container.appendChild(div);
      });
      const savedBg = localStorage.getItem('user_bg');
      if(savedBg) document.documentElement.style.setProperty('--bg-theme', `url('${savedBg}')`);
    }
    function addNote() {
      const text = document.getElementById('note-text').value;
      if(!text) return;
      const notes = JSON.parse(localStorage.getItem('my_notes') || '[]');
      notes.push({ id: Date.now(), text, color: colors[Math.floor(Math.random()*colors.length)], rot: (Math.random()*6-3).toFixed(1) });
      localStorage.setItem('my_notes', JSON.stringify(notes));
      document.getElementById('note-text').value = '';
      closeModal(); loadNotes();
    }
    function delNote(id) {
      const notes = JSON.parse(localStorage.getItem('my_notes') || '[]').filter(n => n.id !== id);
      localStorage.setItem('my_notes', JSON.stringify(notes)); loadNotes();
    }
    function changeBg(event) {
      const file = event.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const url = e.target.result;
        localStorage.setItem('user_bg', url);
        document.documentElement.style.setProperty('--bg-theme', `url('${url}')`);
      };
      reader.readAsDataURL(file);
    }
    function openModal() { document.getElementById('modal').style.display = 'block'; }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    window.onload = loadNotes;
  </script>
</body>
</html>
